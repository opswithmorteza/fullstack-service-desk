<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Service Desk — Portfolio Lab</title><style>body{font:15px/1.6 system-ui;background:#0d1420;color:#e8eef4;margin:0}main{max-width:850px;margin:50px auto;padding:25px}header{border-bottom:1px solid #2a3747;padding-bottom:20px}small{color:#85cdb5}h1{font-size:42px;margin:12px 0}form{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}input,select,button{padding:12px;border-radius:6px;border:1px solid #3a495b;background:#172334;color:inherit;font:inherit}input{flex:1;min-width:200px}button{cursor:pointer}button:hover{border-color:#85cdb5}.incident{padding:22px 0;border-bottom:1px solid #2a3747;display:flex;justify-content:space-between;gap:20px}.incident h2{font-size:18px;margin:0}.meta{font-size:12px;color:#a0adbd}.filters{display:flex;justify-content:space-between;align-items:center}.notice{font-size:12px;color:#98a9ba;margin-top:35px}#message{color:#ffd29b;min-height:24px}a{color:#85cdb5}label{display:block}.sr-only{position:absolute;clip:rect(0,0,0,0)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #85cdb5;outline-offset:3px}</style><main><header><small>MORTEZA RAJABI / FULL-STACK LAB</small><h1>Service desk.</h1><p>Track a small incident from report to resolution.</p></header><form id="create"><label class="sr-only" for="title">Incident title</label><input id="title" placeholder="Describe an incident" required minlength="3" maxlength="160"><label class="sr-only" for="priority">Priority</label><select id="priority"><option>medium</option><option>high</option><option>low</option></select><button>Create incident</button></form><div id="message" role="status"></div><div class="filters"><strong>Incidents</strong><label>Show <select id="filter"><option value="all">All</option><option value="open">Open</option><option value="closed">Closed</option></select></label></div><div id="incidents"></div><p class="notice">Local portfolio demo · Python + SQLite + JavaScript · No authentication; do not expose to public networks.</p></main><script>
let incidents=[];const $=s=>document.querySelector(s);async function api(path,options={}){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}function render(){const root=$('#incidents');root.replaceChildren();const visible=incidents.filter(i=>$('#filter').value==='all'||i.status===$('#filter').value);if(!visible.length){root.textContent='No incidents in this view.';return}for(const i of visible){const row=document.createElement('article');row.className='incident';const body=document.createElement('div'),h=document.createElement('h2'),meta=document.createElement('div'),button=document.createElement('button');h.textContent=i.title;meta.className='meta';meta.textContent='#'+i.id+' · '+i.priority+' priority · '+i.status+' · '+i.created_at+' UTC';button.textContent=i.status==='open'?'Resolve':'Reopen';button.onclick=async()=>{button.disabled=true;try{await api('/api/incidents/'+i.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:i.status==='open'?'closed':'open'})});await load()}catch(e){$('#message').textContent=e.message;button.disabled=false}};body.append(h,meta);row.append(body,button);root.append(row)}}async function load(){incidents=await api('/api/incidents');render()}$('#filter').onchange=render;$('#create').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{await api('/api/incidents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#title').value,priority:$('#priority').value})});$('#title').value='';$('#message').textContent='Incident created.';await load()}catch(e){$('#message').textContent=e.message}finally{button.disabled=false}};load().catch(e=>$('#message').textContent=e.message);
</script></html>
